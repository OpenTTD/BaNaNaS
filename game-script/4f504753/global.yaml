name: "QuartermasterGS"
description: |-
  Quartermaster twists OpenTTD into a logistics-focused RTS where games are won entirely on supply lines. Found your HQ, build outposts, claim territory, defend it with supplies, and push out the competition with military force.

  There are two game modes available to configure at game-start:
  - persist: unprotected ground stays with the owner until contested. Best suited for single-player.
  - decay: unprotected ground becomes neutral. Best suited for competitive play.
