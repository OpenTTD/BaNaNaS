description: "AutoDecor WorldGen is the required companion GameScript for the AutoDecor NewGRF. It generates coherent terrain regions and decorative dirt-path networks connecting towns, industries and scenery. IMPORTANT: download and activate the \"AutoDecor\" NewGRF before starting a NEW game. This script is not designed to work alone. Enable AutoDecor in NewGRF Settings, select AutoDecor WorldGen here, then generate a completely new map."
