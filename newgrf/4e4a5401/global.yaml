name: "njtransit"
description: "A NewGRF covering a century of New Jersey railroading: 26 buyable vehicles from a 1914 Pennsylvania Railroad K4s Pacific through the fallen-flag diesels, the GG1's last run in 1983, NJ TRANSIT's modern fleet and three generations of PATH rapid transit — each in its own railroad's livery, with two selectable stat sets."
url: "https://github.com/joncfrancisco/njtransit"
