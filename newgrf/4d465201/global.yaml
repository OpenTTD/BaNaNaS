name: "Manager Faces: Remastered"
description: |-
  High resolution company manager faces for all four face styles, with graphics for every zoom level (32bpp at 1x, 2x and 4x, plus 8bpp).

  All four managers are remastered. Hairstyles, eyes, noses, lips, chins, real moustaches and beards, separate jackets, shirts and ties, and blazers and blouses. Glasses and earrings have no graphics.

  Based on an old graphics pack from AirwaySim (www.airwaysim.com), remastered for OpenTTD. Created by Sami Puro.
url: "https://github.com/samipuro/openttd-manager-faces"
