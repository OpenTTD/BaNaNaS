name: "Temporal8 Real Aircrafts 32bpp"
description: |-
  "Real Aircrafts" adds real-world aircraft and helicopters from various actual airlines and manufacturers to OpenTTD, featuring highly detailed 32bpp graphics with 4x ExtraZoom support. The pack includes distinct graphics for ground, flight, and takeoff/landing phases, along with unique details such as both static and animated navigation lights.

  It also allows you to customize aircraft purchase and maintenance costs according to your preferences.
