name: "IME-houses"
description: "House set made for the IME game script, based on ITL Houses (Improved Town Layouts) by 2TallTyler. Towns grow denser over time: houses and shops get more inhabitants in every period (1870-1950, set by parameters to match IME's city phases), and towns slowly replace old houses with the version of the current period. High-rise follows from 1970 as the densest step. No passenger condition, no reduced early population. Temperate. Use instead of ITL Houses. GPL v3."
url: "https://drive.google.com/drive/folders/1dzFwNoElXTSh9E8mSjSSW83a0WZA2PLw?usp=sharing"
