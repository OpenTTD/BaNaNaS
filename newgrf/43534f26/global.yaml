name: "California Skyscrapers Objects"
description: |-
  A variety of California skyscrapers from Los Angeles, San Diego and San Francisco, that can be used as decorative objects.
  Includes snow sprites, ground decor, customization via parameters, real-world stats and occasional trivia.

  Remake of "Generic Skyscraper Objects Set" by CaptainKlutz
  Original "California City Set" by Luxtram
  Updated and recoded by chujo
  Some decor elements borrowed from Mrsunman's AEC
  and Zephyris' Full English.

  August 18, 2026
url: "https://github.com/chujo-chujo/California-Skyscrapers-as-Objects"
