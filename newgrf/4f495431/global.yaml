name: "Open Industries: Temperate"
description: "Open Industries: Temperate is a complete Temperate economy replacement for OpenTTD 15.3. Version 0.2.0 provides 28 cargoes, 28 industries, 14 stockpiled processing chains, three cargo-accepting town buildings, service-responsive primary production, and cargo-reactive industry graphics."
