name: "Mainline 1520"
description: "Balanced train set for 1520 mm gauge: locomotives, multiple units, metro trains and wagons from the 1880s to the 2010s, steam, diesel and electric. Works with FIRS and any other industry set. BETA 0.x: savegames may break between versions. Open playtest: look for the [PLAYTEST] server. Graphics are based on xUSSR Set graphics (CC BY-NC-SA 3.0), adapted; not affiliated with the xUSSR authors."
