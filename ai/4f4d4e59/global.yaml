name: "OmniYield"
description: |-
  ROI-driven multimodal AI designed to compete against community AIs and human players.

  Features:
  - Twin-Track PBS Rail, InterCity Express & goods trains
  - Automatic rail conversion (Normal -> Electric -> Monorail -> Maglev)
  - Airport hubs, automatic hub upgrades & transfer bus feeders
  - Secondary industry chains & subsidy hunting
  - Controlled terraforming & demolition (toggleable in settings)

  Author: Kai Fischer (Elbtalwerk)
  Feedback: elbtalwerk.kontakt@gmx.de
