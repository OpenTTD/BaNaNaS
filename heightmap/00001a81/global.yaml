name: "Calabria (JGRPP)"
description: "This heightmap allows you to generate Calabria, including the Strait of Messina. In addition, the Aeolian Islands have been moved toward the Gulf of Gioia Tauro to include them on the map. This version is compatible only with JGRPP (size 16384x16384). On the TT-Forum, you can download a JSON file that allows you to place cities in their actual locations, with population data included."
url: "https://www.tt-forums.net/viewtopic.php?p=1280051#p1280051"
